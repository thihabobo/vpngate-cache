name: Auto-Update VPNGate Servers

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python fetch_servers.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add servers.csv japan_servers.csv metadata.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update VPN Gate servers [skip ci]" && git push)
